name: Robô de Tráfego Cuiabá 40 Graus

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # <-- Isso libera o botão de disparo manual no GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: node trafego.js